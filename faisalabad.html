
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Book Lahore | Haidri Studio</title>
<link rel="stylesheet" href="style.css">

<style>
* { box-sizing: border-box; }

body {
    margin: 0;
    background: #080808;
    color: #f5f5f5;
    font-family: Arial, sans-serif;
}

.booking-section {
    min-height: 100vh;
    padding: 50px 20px;
    background: #080808;
}

.booking-container {
    max-width: 750px;
    margin: auto;
}

.back-link {
    color: #ff7659;
    text-decoration: none;
}

h1 {
    font-size: 48px;
    margin-bottom: 10px;
}

.intro {
    color: #999;
    line-height: 1.7;
    margin-bottom: 30px;
}

.booking-form {
    background: #111;
    border: 1px solid #292929;
    padding: 30px;
}

.form-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 18px;
}

.field {
    display: flex;
    flex-direction: column;
    gap: 9px;
}

.full {
    grid-column: 1 / -1;
}

label {
    font-size: 14px;
}

input, select, textarea {
    width: 100%;
    padding: 14px;
    background: #080808;
    color: white;
    border: 1px solid #333;
    font-size: 14px;
}

textarea {
    min-height: 120px;
}

button {
    width: 100%;
    padding: 16px;
    margin-top: 22px;
    border: none;
    background: #ff7659;
    color: #080808;
    font-weight: bold;
    cursor: pointer;
}

@media(max-width:600px) {
    .form-grid {
        grid-template-columns: 1fr;
    }

    .full {
        grid-column: auto;
    }

    h1 {
        font-size: 36px;
    }
}
</style>
</head>

<body>

<section class="booking-section">
<div class="booking-container">

<a href="areas.html" class="back-link">← Back to Service Areas</a>

<h1>Book Your Event in Lahore</h1>

<p class="intro">
Tell us about your wedding or event. Fill out the form
and contact Haidri Studio directly on WhatsApp.
</p>

<form class="booking-form" id="bookingForm">

<div class="form-grid">

<div class="field">
<label>Full Name *</label>
<input type="text" id="name" required>
</div>

<div class="field">
<label>Phone / WhatsApp *</label>
<input type="tel" id="phone" required>
</div>

<div class="field">
<label>Email Address</label>
<input type="email" id="email">
</div>

<div class="field">
<label>Select Service *</label>
<select id="service" required>
<option value="">Choose Service</option>
<option>Wedding Photography</option>
<option>Wedding Films & Cinematography</option>
<option>Wedding & Event Coverage</option>
<option>Wedding Albums & Editing</option>
<option>Other</option>
</select>
</div>

<div class="field full">
<label>Wedding / Event Date</label>
<input type="date" id="date">
</div>

<div class="field full">
<label>Message</label>
<textarea id="message" placeholder="Tell us about your event..."></textarea>
</div>

</div>

<button type="submit">Submit Booking on WhatsApp ↗</button>

</form>
</div>
</section>

<script>
document.getElementById("bookingForm").addEventListener("submit", function(e) {
    e.preventDefault();

    const city = "Lahore";

    const message =
`Haidri Studio Booking Enquiry

City: ${city}
Name: ${document.getElementById("name").value}
Phone: ${document.getElementById("phone").value}
Email: ${document.getElementById("email").value || "Not provided"}
Service: ${document.getElementById("service").value}
Date: ${document.getElementById("date").value || "Not provided"}
Message: ${document.getElementById("message").value || "Not provided"}`;

    window.open(
        "https://wa.me/923074120607?text=" + encodeURIComponent(message),
        "_blank"
    );
});
</script>

</body>
</html>
